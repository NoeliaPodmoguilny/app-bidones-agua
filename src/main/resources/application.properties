spring.application.name=bidones

# Config Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Config de JWT
security.jwt.private.key=${JWT_KEY}
security.jwt.user.generator=${USER_GENERATOR}

# expo access token
expo.access-token=${TOKEN_EXPO}

# url front end
url-front=${URL-FRONT}
# respuestas comprimidas
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
